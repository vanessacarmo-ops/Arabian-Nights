<style>
:root{
  --rosa:#b99355;
  --dourado:#d4af37;
  --preto:#0b0b0b;
  --texto:#f5f5f5;
  --cinza:#aaa;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#000000;
  color:#fff;
}

header{
  background:linear-gradient(135deg,#050505,#1a1a1a);
  padding:30px 18px 22px;
  text-align:center;
  border-bottom:2px solid var(--dourado);
}

.logo{
  font-family:Georgia,serif;
  font-size:46px;
  color:var(--rosa);
  margin:0;
  letter-spacing:2px;
}

.tag{
  margin:7px 0 22px;
  color:#c9b89b;
  font-size:15px;
}

nav{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

nav button{
  border:1px solid #b99355;
  border-radius:25px;
  padding:11px 20px;
  cursor:pointer;
  background:#111;
  color:#ddd;
  font-size:14px;
}

nav button.active,
nav button:hover{
  background:var(--rosa);
  color:white;
}

main{
  max-width:1150px;
  margin:auto;
  padding:35px 18px 60px;
}

.hero{
  text-align:center;
  margin-bottom:30px;
}

.hero h1{
  font-family:Georgia,serif;
  font-size:34px;
  color:#765668;
  margin:0 0 10px;
}

.hero p{
  color:#777;
  font-size:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:22px;
}

.card{
  background:#111;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 5px 18px #bbb;
  border:1px solid #ddd;
}

.card img{
  width:100%;
  height:260px;
  object-fit:cover;
  background:white;
  display:block;
}

.info{
  padding:16px;
}

.info h3{
  font-family:Georgia,serif;
  margin:0 0 8px;
  font-size:20px;
  color:white;
}

.cat{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--rosa);
  font-weight:bold;
}

.price{
  margin-top:12px;
  color:#d4af37;
  font-weight:bold;
}

.soon{
  color:#aaa;
  font-weight:normal;
}

.empty{
  padding:50px 20px;
  text-align:center;
  background:#111;
  border-radius:18px;
  border:1px dashed #b99355;
  color:#ccc;
}

footer{
  text-align:center;
  padding:28px;
  color:#777;
  font-size:13px;
  border-top:1px solid #ddd;
  background:#fff;
}

@media(max-width:600px){
  .logo{
    font-size:36px;
  }

  .hero h1{
    font-size:28px;
  }

  .card img{
    height:230px;
  }
}
</style>
</head>

button.classList.add("active");

render(button.dataset.cat);

let cart = [];

function addToCart(productName) {
  const existing = cart.find(item => item.name === productName);

  if (existing) {
    existing.quantity++;
  } else {
    cart.push({
      name: productName,
      quantity: 1
    });
  }

  updateCart();
}

function updateCart() {
  let cartButton = document.getElementById("cartButton");

  if (!cartButton) {
    cartButton = document.createElement("button");
    cartButton.id = "cartButton";
    cartButton.style.position = "fixed";
    cartButton.style.right = "20px";
    cartButton.style.bottom = "20px";
    cartButton.style.zIndex = "9999";
    cartButton.style.padding = "14px 20px";
    cartButton.style.borderRadius = "30px";
    cartButton.style.border = "1px solid #d4af37";
    cartButton.style.background = "#000";
    cartButton.style.color = "#d4af37";
    cartButton.style.fontSize = "16px";
    cartButton.style.cursor = "pointer";

    cartButton.onclick = showCart;

    document.body.appendChild(cartButton);
  }

  const totalItems = cart.reduce((total, item) => total + item.quantity, 0);

cartButton.innerHTML = "Carrinho (" + totalItems + ")";
}

function showCart() {
    const oldCart = document.getElementById("cartModal");
    if (oldCart) oldCart.remove();

    const modal = document.createElement("div");
    modal.id = "cartModal";

    modal.style.position = "fixed";
    modal.style.top = "0";
    modal.style.left = "0";
    modal.style.width = "100%";
    modal.style.height = "100%";
    modal.style.background = "rgba(0,0,0,0.75)";
    modal.style.zIndex = "10000";
    modal.style.display = "flex";
    modal.style.justifyContent = "flex-end";

    const box = document.createElement("div");

    box.style.width = "380px";
    box.style.maxWidth = "90%";
    box.style.height = "100%";
    box.style.background = "#000";
    box.style.color = "#fff";
    box.style.padding = "25px";
    box.style.boxSizing = "border-box";
    box.style.overflowY = "auto";
    box.style.borderLeft = "1px solid #d4af37";

    let html = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;">
            <h2 style="color:#d4af37;margin:0;">🛒 Meu Carrinho</h2>
            <button id="closeCart"
                style="background:none;border:none;color:#d4af37;font-size:28px;cursor:pointer;">
                ×
            </button>
        </div>
    `;

    if (cart.length === 0) {
        html += `
            <div style="text-align:center;margin-top:80px;">
                <div style="font-size:50px;">🛍️</div>
                <h3>Seu carrinho está vazio</h3>
                <p style="color:#aaa;">Adicione os produtos que deseja comprar.</p>
            </div>
        `;
    } else {
        cart.forEach((item, index) => {
            html += `
                <div style="
                    border-bottom:1px solid #333;
                    padding:18px 0;
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                    gap:10px;
                ">
                    <div>
                        <div style="color:#d4af37;font-weight:bold;font-size:16px;">
                            ${item.name}
                        </div>
                       <div style="margin-top:8px;color:#ccc;">
  Quantidade:
  <button onclick="changeQuantity(${index}, -1)"
    style="background:#000;color:#d4af37;border:1px solid #d4af37;border-radius:5px;padding:3px 9px;cursor:pointer;">
    −
  </button>

  <strong style="margin:0 8px;color:#fff;">${item.quantity}</strong>

  <button onclick="changeQuantity(${index}, 1)"
    style="background:#000;color:#d4af37;border:1px solid #d4af37;border-radius:5px;padding:3px 9px;cursor:pointer;">
    +
  </button>
</div>

<div style="margin-top:5px;color:#999;font-size:13px;">
  Preço em breve
</div>
</div>

<button
  onclick="removeFromCart(${index})"
  style="
    background:#000;
    color:#d4af37;
    border:1px solid #d4af37;
    border-radius:6px;
    padding:6px 10px;
    cursor:pointer;
  ">
  Remover
</button>
                </div>
            `;
        });

        html += `
            <div style="margin-top:30px;">
                <p style="color:#aaa;font-size:14px;">
                    Os preços serão definidos quando os produtos estiverem disponíveis.
                </p>

                <button
                    onclick="closeCart()"
                    style="
                        width:100%;
                        padding:14px;
                        background:#d4af37;
                        color:#000;
                        border:none;
                        border-radius:8px;
                        font-weight:bold;
                        font-size:16px;
                        cursor:pointer;
                    ">
                    Continuar comprando
                </button>
                <button
  onclick="sendWhatsAppOrder()"
  style="
    width:100%;
    padding:14px;
    margin-top:10px;
    background:#25D366;
    color:#fff;
    border:none;
    border-radius:8px;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
  "
>
  Finalizar pedido pelo WhatsApp
  ${cart.length === 1 && cart[0].quantity === 1 && cart[0].name === "Kit Bade'e Al Oud" ? '<button onclick="window.open(\'https://mpago.la/1y79sXb\', \'_blank\')" style="width:100%;padding:14px;margin-top:10px;background:#009ee3;color:#fff;border:none;border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer;">Pagar pelo Mercado Pago 💳</button>' : cart.length === 1 && cart[0].quantity === 1 && cart[0].name === "Asad Bourbon" ? '<button onclick="window.open(\'https://mpago.la/2eyppeY\', \'_blank\')" style="width:100%;padding:14px;margin-top:10px;background:#009ee3;color:#fff;border:none;border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer;">Pagar pelo Mercado Pago 💳</button>' : ""}

            </div>
        `;
    }

    box.innerHTML = html;
    modal.appendChild(box);
    document.body.appendChild(modal);

    document.getElementById("closeCart").onclick = closeCart;

    modal.onclick = function(event) {
        if (event.target === modal) {
            closeCart();
        }
    };
}

function closeCart() {
    const modal = document.getElementById("cartModal");
    if (modal) modal.remove();
}
function changeQuantity(index, change) {
  const item = cart[index];

  if (!item) return;

  item.quantity += change;

  if (item.quantity <= 0) {
    cart.splice(index, 1);
  }

  updateCart();
  showCart();
}
function removeFromCart(index) {
    cart.splice(index, 1);
    updateCart();
    showCart();
}

updateCart();
render("perfumes");
  function sendWhatsAppOrder() {
  if (cart.length === 0) {
    alert("Seu carrinho está vazio.");
    return;
  }

  let message = "Olá! Gostaria de fazer este pedido:%0A%0A";

  cart.forEach((item) => {
    message += "• " + item.name + " — Quantidade: " + item.quantity + "%0A";
  });

  message += "%0AGostaria de confirmar a disponibilidade e o valor total.";
  if (cart.length === 1 && cart[0].name === "Kit Bade'e Al Oud" && cart[0].quantity === 1) {
    message += "%0A%0APagamento pelo Mercado Pago:%0Ahttps://mpago.la/1y79sXb";
}

  const phone = "5541997138077";
  window.open("https://wa.me/" + phone + "?text=" + message, "_blank");
}
